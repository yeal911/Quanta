name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      # MinVer 需要 git tag 计算版本号，必须完整拉取历史与 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Quanta.sln -c Debug

      - name: Test
        run: dotnet test Quanta.sln -c Debug --no-build
